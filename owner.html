<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><span class="logo">Dashboard owner</span><button class="btn" id="logout" type="button" hidden>Keluar</button></header>
<main>
  <section id="login">
    <h2>Masuk</h2>
    <form class="card" id="login-form">
      <label for="l-email">Email</label>
      <input id="l-email" type="email" autocomplete="username">
      <label for="l-pass">Password</label>
      <input id="l-pass" type="password" autocomplete="current-password">
      <p class="msg err" id="login-msg" hidden></p>
      <button class="btn y" id="login-btn">Masuk</button>
    </form>
  </section>

  <div id="dash" hidden>
    <nav class="nav">
      <a class="btn y" href="#s-products">Produk</a>
      <a class="btn p" href="#s-banner">Banner</a>
      <a class="btn k" href="#s-pay">Pembayaran</a>
      <a class="btn" href="#s-orders">Pesanan</a>
    </nav>

    <section id="s-products">
      <h2>Produk</h2>
      <form class="card" id="p-form" novalidate>
        <input id="p-id" type="hidden">
        <label for="p-name">Nama produk</label>
        <input id="p-name" maxlength="80" placeholder="Panel 1 GB">
        <label for="p-desc">Deskripsi</label>
        <textarea id="p-desc" rows="2" maxlength="200"></textarea>
        <label for="p-price">Harga per bulan (Rp)</label>
        <input id="p-price" type="number" inputmode="numeric" min="1" placeholder="13000">
        <label for="p-disc">Diskon (0 sampai 100 persen)</label>
        <input id="p-disc" type="number" inputmode="numeric" min="0" max="100" value="0">
        <label for="p-sort">Urutan tampil</label>
        <input id="p-sort" type="number" inputmode="numeric" value="0">
        <label class="inline"><input id="p-active" type="checkbox" checked>Aktif</label>
        <p class="msg err" id="p-msg" hidden></p>
        <button class="btn y" id="p-save">Simpan produk</button>
        <button class="btn" id="p-reset" type="button">Kosongkan form</button>
      </form>
      <div id="p-list"></div>
    </section>

    <section id="s-banner">
      <h2>Banner</h2>
      <div class="card">
        <label class="inline"><input type="radio" name="b-type" value="image" checked>Gambar</label>
        <label class="inline"><input type="radio" name="b-type" value="video">Video</label>
        <label for="b-file">File gambar</label>
        <input id="b-file" type="file" accept="image/*">
        <label for="b-url">Link video mp4 (https)</label>
        <input id="b-url" type="url" placeholder="https://contoh.com/banner.mp4">
        <div class="prev" id="b-prev" hidden></div>
        <p class="msg err" id="b-msg" hidden></p>
        <button class="btn y" id="b-save" type="button">Simpan banner</button>
        <button class="btn p" id="b-del" type="button">Hapus banner</button>
      </div>
    </section>

    <section id="s-pay">
      <h2>Pembayaran</h2>
      <div class="card">
        <label for="m-store">Nama toko</label>
        <input id="m-store" maxlength="40" placeholder="EpinStore">
        <label for="m-wa">Nomor WhatsApp owner</label>
        <input id="m-wa" inputmode="tel" placeholder="6285545153532">
        <label for="m-url">Link gambar QRIS (https)</label>
        <input id="m-url" type="url" placeholder="https://contoh.com/qris.png">
        <div class="prev" id="m-prev" hidden></div>
        <p class="msg err" id="m-msg" hidden></p>
        <button class="btn y" id="m-save" type="button">Simpan pembayaran</button>
      </div>
    </section>

    <section id="s-orders">
      <h2>Pesanan masuk</h2>
      <p class="msg err" id="o-msg" hidden></p>
      <div id="o-list"></div>
    </section>
  </div>
</main>
<script type="module" src="owner.js"></script>
</body>
</html>
